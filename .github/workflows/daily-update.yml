name: Daily Repository Update

permissions:
  contents: write

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update file - 23f2004130@ds.study.iitm.ac.in
        run: |
          echo "Last updated on $(date -u)" >> daily-log.txt

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "23f2004130@ds.study.iitm.ac.in"
          git add daily-log.txt
          git diff --cached --quiet || git commit -m "Automated daily update"
          git push
