name: Daily Repository Update

on:
  schedule:
    - cron: "30 2 * * *"   # Runs daily at 02:30 UTC (specific time, no wildcards)
  workflow_dispatch:        # Lets you run it manually for testing

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update file - 23f2004130@ds.study.iitm.ac.in
        run: |
          echo "Last updated on $(date -u)" >> daily-log.txt

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "23f2004130@ds.study.iitm.ac.in"
          git add daily-log.txt
          git commit -m "Automated daily update"
          git push
